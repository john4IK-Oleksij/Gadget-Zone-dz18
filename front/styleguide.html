<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="static/images/favicon.ico">
    <title>Style guide | Gadget Zone</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="page">
    <main class="page__content stack">
        <h1 class="page__title">Style guide (dev-only, можна видалити)</h1>

        <section class="stack">
            <h2>Buttons</h2>
            <div class="row">
                <button class="button button--primary" type="button">Primary</button>
                <button class="button button--cta" type="button">Add to Cart (CTA)</button>
                <button class="button button--outline" type="button">Outline</button>
                <button class="button button--danger" type="button">Danger</button>
                <button class="button button--primary" type="button" disabled>Disabled</button>
            </div>
        </section>

        <section class="stack">
            <h2>Banners</h2>
            <div class="banner banner--success">Success message</div>
            <div class="banner banner--error">Error message</div>
        </section>

        <section class="stack">
            <h2>Form</h2>
            <div class="form-field">
                <label class="form-field__label" for="sg-email">Email</label>
                <input class="form-field__input" id="sg-email" type="email" placeholder="you@example.com">
            </div>
        </section>

        <section class="stack">
            <h2>Cards, price, badge, image placeholder</h2>
            <div class="product-grid">
                <article class="product-card">
                    <div class="product-card__media">
                        <a class="product-card__image-link" href="#"><div class="media-placeholder product-card__image"></div></a>
                        <div class="product-card__actions">
                            <a class="product-card__action product-card__action--eye" href="#" aria-label="View details">&#128065;</a>
                            <button class="product-card__action product-card__action--cart" type="button" aria-label="Add to cart">+</button>
                        </div>
                    </div>
                    <div class="product-card__body">
                        <h3 class="product-card__title"><a class="product-card__title-link" href="#">Product without image</a></h3>
                        <p class="product-card__price price"><span class="price__current">$499</span><span class="price__old">$599</span></p>
                    </div>
                </article>
                <article class="product-card">
                    <div class="product-card__media">
                        <a class="product-card__image-link" href="#"><div class="media-placeholder product-card__image"></div></a>
                        <span class="badge badge--sold-out product-card__badge">Sold out</span>
                        <div class="product-card__actions">
                            <a class="product-card__action product-card__action--eye" href="#" aria-label="View details">&#128065;</a>
                        </div>
                    </div>
                    <div class="product-card__body">
                        <h3 class="product-card__title"><a class="product-card__title-link" href="#">Sold out product</a></h3>
                        <p class="product-card__price price"><span class="price__current">$1399</span></p>
                    </div>
                </article>
            </div>
        </section>

        <section class="stack">
            <h2>Page states</h2>
            <div class="state-message">Loading...</div>
            <div class="state-message">Empty...</div>
            <div class="state-message state-message--error">Error...</div>
        </section>
    </main>
</body>
</html>
